name: diag-signing
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect SIGNING_KEY shape (no value output)
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "SIGNING_KEY_ID len=${#SIGNING_KEY_ID} value_digits_only=$([[ "$SIGNING_KEY_ID" =~ ^[0-9A-Fa-f]+$ ]] && echo yes || echo no)"
          echo "SIGNING_KEY bytes=${#SIGNING_KEY}"
          printf '%s' "$SIGNING_KEY" | wc -c
          printf '%s' "$SIGNING_KEY" | awk '{n++} END{print "lines=" n}'
          # newline presence
          if printf '%s' "$SIGNING_KEY" | grep -q $'\n'; then echo "has_newline=yes"; else echo "has_newline=no"; fi
          # is it decodable as single-line base64?
          if printf '%s' "$SIGNING_KEY" | base64 -d >/dev/null 2>&1; then echo "base64_decode=ok"; else echo "base64_decode=fail"; fi
          # first decoded line (header only, no key material)
          printf '%s' "$SIGNING_KEY" | base64 -d 2>/dev/null | head -1
