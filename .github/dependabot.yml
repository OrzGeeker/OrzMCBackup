# Automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # C21: 按领域分组聚合依赖更新，避免 N 个独立 PR × 全矩阵 churn。
    # 一个依赖只归入第一个匹配的 group，故 quality-tooling 必须在前（kover 在 kotlinx 命名空间下）。
    groups:
      quality-tooling:
        patterns:
          - "com.pinterest.ktlint*"
          - "io.gitlab.arturbosch.detekt*"
          - "org.jetbrains.kotlinx.kover*"
      kotlin-and-coroutines:
        patterns:
          - "org.jetbrains.kotlin*"
      runtime-and-test:
        patterns:
          - "org.lz4*"
          - "info.picocli*"
          - "org.junit*"
          - "org.jetbrains.dokka*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    # C21: Actions 生态体量小，全部聚合为单个 PR 即可
    groups:
      github-actions-all:
        patterns:
          - "*"
